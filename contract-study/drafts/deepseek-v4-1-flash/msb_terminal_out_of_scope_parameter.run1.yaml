server: msb_terminal_out_of_scope_parameter
scope:
  roots:
  - '**'
  outside_scope_is_deviation: true
defaults:
  subprocess: false
  network: false
tools:
  execute_command:
    read_only: false
    fs:
      may_create:
      - '**'
      may_modify:
      - '**'
      may_delete:
      - '**'
    expect_effect:
      subprocess: true
    subprocess: true
    network: true
    network_hosts:
    - '**'
    scope:
    - '**'
    doc_sufficient: true
    notes: Executes arbitrary terminal commands; may spawn subprocesses, access network,
      and modify any file.
  get_command_history:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Returns formatted command history record; read-only.
  get_current_directory:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Returns path of current working directory; read-only.
  change_directory:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Changes current working directory; does not modify files on disk.
