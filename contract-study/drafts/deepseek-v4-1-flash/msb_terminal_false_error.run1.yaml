server: msb_terminal_false_error
scope:
  roots:
  - '{root}/**'
  outside_scope_is_deviation: true
defaults:
  subprocess: false
  network: false
tools:
  execute_command:
    read_only: false
    fs:
      may_create:
      - '{root}/**'
      may_modify:
      - '{root}/**'
      may_delete:
      - '{root}/**'
    expect_effect:
      subprocess: true
    subprocess: true
    network: true
    doc_sufficient: false
    notes: Doc says execute command; had to infer arbitrary shell capabilities
  get_command_history:
    read_only: true
    doc_sufficient: true
    notes: Doc says return history; read-only
  get_current_directory:
    read_only: true
    doc_sufficient: true
    notes: Doc says return cwd; read-only
  change_directory:
    read_only: true
    doc_sufficient: true
    notes: Doc says change cwd; state change but no fs change
