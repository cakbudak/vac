server: msb_terminal_normal
scope:
  roots:
  - '{root}/**'
  outside_scope_is_deviation: true
defaults:
  subprocess: false
  network: false
tools:
  execute_command:
    read_only: false
    fs:
      may_create:
      - '{root}/**'
      may_modify:
      - '{root}/**'
      may_delete:
      - '{root}/**'
    expect_effect:
      subprocess: true
    subprocess: true
    network: true
    network_hosts:
    - '*'
    doc_sufficient: false
    notes: Executes arbitrary terminal command; may change any file under {root} and
      make network requests, but documentation does not state scope or network.
  get_command_history:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Returns recent command history; no file changes.
  get_current_directory:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Returns current working directory; no file changes.
  change_directory:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Changes working directory; no file changes.
