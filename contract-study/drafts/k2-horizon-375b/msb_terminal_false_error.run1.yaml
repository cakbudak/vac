server: mb_terminal_false_error
scope:
  roots:
  - '{root}/**'
  outside_scope_is_deviation: true
defaults:
  subprocess: false
  network: false
tools:
  execute_command:
    read_only: false
    fs:
      may_create:
      - '{root}/**'
      may_modify:
      - '{root}/**'
      may_delete:
      - '{root}/**'
    subprocess: true
    network: true
    network_hosts:
    - '*'
    doc_sufficient: false
    notes: Description says execute terminal command; added that it may change any
      file under {root}, spawn subprocess, and use network because a shell can do
      anything.
  get_command_history:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Description says get recent command history; no side effects documented.
  get_current_directory:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Description says get current working directory; no side effects documented.
  change_directory:
    read_only: true
    subprocess: false
    network: false
    doc_sufficient: true
    notes: Description says change current working directory; no file changes documented.
